name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `bun build --compile` can cross-compile every target from one runner, but
# then nothing would ever run the mac and windows binaries before they ship.
# The matrix builds each target on its own OS so the smoke check exercises the
# artefact that is actually uploaded -- the same reason `make binary-test`
# exists locally (see devel/bun-migration202609.md).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bun-target: bun-linux-x64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            bun-target: bun-darwin-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bun-target: bun-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Pinned: Bun shipped relaxed-SIMD support mid-1.3.x, and the kernel is
      # sensitive to engine wasm features. A floating version would let that
      # class of breakage in silently.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Dependencies stay on pnpm; Bun consumes the node_modules it builds.
      # Node is still needed for `pnpm -r build` (tsc).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      # Unit tests only. The B-Rep regression suite used to be unrunnable here
      # because its examples and snapshots lived in sibling repositories; they
      # were consolidated into tests/ on 2026-09-02, so it could run from this
      # checkout now. Turning it on is still an open decision -- it currently
      # stays a `make fulltest` gate.
      - name: Test
        shell: bash
        run: |
          for p in packages/core packages/cli packages/browser; do
            (cd "$p" && bun x vitest run) || exit 1
          done

      - name: Compile single binary
        shell: bash
        run: |
          mkdir -p build/bin
          bun build --compile --target=${{ matrix.bun-target }} \
            packages/cli/bun-entry.ts --outfile build/bin/poly

      # Proves the 22 MB kernel really is embedded: a fresh directory with no
      # node_modules is where the pre-2026-09-02 Bun attempt died with
      # `ENOENT: '/$bunfs/root/occt-wasm.wasm'`.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) BIN="$PWD/build/bin/poly.exe";;
            *)       BIN="$PWD/build/bin/poly";;
          esac
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          printf 'box 20 20 10\n | edges ">Z" | fillet 2\n' > smoke.poly
          "$BIN" --version
          "$BIN" info smoke.poly
          "$BIN" build smoke.poly -o smoke.stl
          size=$(wc -c < smoke.stl)
          echo "smoke.stl = $size bytes"
          [ "$size" -gt 1024 ] || { echo "STL is implausibly small"; exit 1; }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          mkdir -p build/release
          case "${{ runner.os }}" in
            Windows)
              cp build/bin/poly.exe "$stage/poly.exe"
              (cd "$stage" && 7z a -tzip poly.zip poly.exe >/dev/null)
              mv "$stage/poly.zip" "build/release/poly-${{ matrix.platform }}.zip"
              ;;
            *)
              cp build/bin/poly "$stage/poly"
              chmod +x "$stage/poly"
              tar czf "build/release/poly-${{ matrix.platform }}.tar.gz" -C "$stage" poly
              ;;
          esac
          ls -la build/release/

      - uses: actions/upload-artifact@v4
        with:
          name: poly-${{ matrix.platform }}
          path: |
            build/release/poly-*.tar.gz
            build/release/poly-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `artifacts/` rather than `dist/`: in this repo dist/ is tsc output and
      # build/ is what a build writes, so a third meaning would just confuse.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      # No SHA256SUMS asset: GitHub records a SHA-256 digest for every uploaded
      # asset and shows it under the file on the release page (also `digest` in
      # the releases API). A checksum file we generate ourselves would just
      # restate it, and is no more trustworthy -- both come from the same upload.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/poly-*
          generate_release_notes: true
          body: |
            PolyScript CLI — single-binary builds produced with `bun build --compile`.
            No runtime install needed. GitHub shows each asset's SHA-256 digest
            beneath the file; verify your download against that.
